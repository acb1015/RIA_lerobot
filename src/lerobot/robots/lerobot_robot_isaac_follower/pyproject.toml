[project]
name = "lerobot_robot_isaac_follower"
version = "0.1.0"
description = "Isaac Sim follower robot for LeRobot over ROS 2 topics"
dependencies = [
    "lerobot>=0.4.4,<0.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.entry-points."lerobot.robot"]
IsaacFollowerConfig = "lerobot_robot_isaac_follower.config_isaac_follower:IsaacFollowerConfig"

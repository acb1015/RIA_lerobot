[project]
name = "lerobot_teleoperator_isaac_leader"
version = "0.1.0"
description = "Isaac Sim leader teleoperator for LeRobot over ROS 2 topics"
dependencies = [
    "lerobot>=0.4.4,<0.5",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.entry-points."lerobot.teleoperators"]
IsaacLeaderConfig = "lerobot_teleoperator_isaac_leader.config_isaac_leader:IsaacLeaderConfig"
